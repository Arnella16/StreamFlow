<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlow - Upload Video</title>
    <style>
        :root {
            --primary-color: #646cff;
            --hover-color: #535bf2;
        }

        body {
            margin: 0;
            display: flex;
            place-items: center;
            min-width: 320px;
            min-height: 100vh;
            background-color: #242424;
            color: rgba(255, 255, 255, 0.87);
            font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 1.5em;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        input[type="file"] {
            padding: 0.6em 1.2em;
            border-radius: 8px;
            border: 1px solid transparent;
            background-color: #1a1a1a;
            color: white;
            cursor: pointer;
            width: 100%;
        }

        button {
            padding: 0.6em 1.2em;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 1em;
            font-weight: 500;
            font-family: inherit;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: background-color 0.25s;
        }

        button:hover {
            background-color: var(--hover-color);
        }

        #result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            background-color: #1a1a1a;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--primary-color);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--hover-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Video</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" name="video" accept="video/*" required>
            <button type="submit">Upload</button>
        </form>
        <div id="result"></div>
        <a href="http://localhost:3000" class="back-link">← Back to Home</a>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = async function(e) {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Uploading...';

            try {
                const formData = new FormData(this);
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                resultDiv.innerHTML = data.message + "<br>" +
                    (data.path ? `<a href="${data.path}" target="_blank" class="back-link">View Video</a>` : "");
            } catch (err) {
                resultDiv.textContent = "Upload failed: " + err.message;
            }
        };
    </script>
</body>
</html>
